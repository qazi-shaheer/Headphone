<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>

<body>
    <div class="box">
        <h1 class="blu">Wireless Headphone</h1>
        <div class="box1">
            <img id="changeimage" class="img" src="./image/image1.jpg">
            <div class="content1">
                <h1>Wireless Headphone</h1>
                <p id="changetext">High quality wireless Headphone with great sound, <br>long battery life and
                    comfortable design</p>
                <span>
                    <h3>$49.99</h3>
                </span>
                <button class="btn1" onclick="changemsg()"><i class="fa-solid fa-cart-shopping"></i>
                    Buy Now</button>
                <button class="btn2" onclick="showProduct()"><i class="fa-solid fa-arrows-rotate"></i>
                    Change Product</button>
                <input id="names" class="input" type="text" placeholder="Enter your name">
                <button class="btn3" onclick="showWelcome()"><i class="fa-solid fa-user"></i>
                    Show Welcome</button>
                <div class="box2" id="welcomecard">
                    <i class="fa-solid fa-user"></i>
                </div>
            </div>
        </div>
    </div>
    <script src="app.js"></script>
</body>

</html>
